[package]
name = "ay-launcher-core"
version = "0.1.0"
edition = "2021"
description = "Performance core for AY Launcher (downloads, process helpers, integrity)"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
log = "0.4"
sha2 = "0.10"
futures = "0.3"

[profile.release]
lto = true
codegen-units = 1
